<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paws &amp; Plates">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>Paws &amp; Plates — FEHD status</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #14171a; --dim: #6b7280;
    --line: #e5e7eb; --ok: #0f7b3d; --okbg: #e7f6ec;
    --new: #0b5cad; --newbg: #e8f1fb; --gone: #9a3412; --gonebg: #fdf0e8;
    --warn: #b42318; --warnbg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --dim: #9198a1;
      --line: #2a3038; --ok: #4ac57e; --okbg: #10261a;
      --new: #6cb1f5; --newbg: #0e1f31; --gone: #f0a06a; --gonebg: #2b1a10;
      --warn: #ff8a80; --warnbg: #2d1412;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 14px;
  }
  .banner { text-align: center; padding: 26px 18px; }
  .banner .icon { font-size: 40px; line-height: 1; }
  .banner .head { font-size: 21px; font-weight: 650; margin: 10px 0 4px; letter-spacing: -0.01em; }
  .banner .note { color: var(--dim); font-size: 14px; }
  .ok   { background: var(--okbg);   border-color: transparent; }
  .ok .head { color: var(--ok); }
  .warn { background: var(--warnbg); border-color: transparent; }
  .warn .head { color: var(--warn); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line);
           border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 14px; }
  .fact { background: var(--card); padding: 14px 16px; }
  .fact .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .fact .v { font-size: 17px; font-weight: 600; margin-top: 3px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;
       color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 9px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; padding-bottom: 0; }
  li:first-child { padding-top: 0; }
  .name { font-weight: 550; }
  .zh { color: var(--dim); font-size: 14px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 650; padding: 2px 7px;
         border-radius: 6px; margin-right: 7px; vertical-align: 1px; }
  .t-new  { background: var(--newbg);  color: var(--new); }
  .t-gone { background: var(--gonebg); color: var(--gone); }
  .empty { color: var(--dim); font-size: 14px; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600; font-family: inherit;
    color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; cursor: pointer;
  }
  button:active { opacity: 0.6; }
  .hist { font-size: 14px; color: var(--dim); }
  .hist li { display: flex; justify-content: space-between; gap: 12px; }
  footer { text-align: center; color: var(--dim); font-size: 12px; margin-top: 22px; line-height: 1.7; }
  a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Paws &amp; Plates</h1>
  <div class="sub">FEHD dog-friendly restaurant list</div>
  <div id="app"><div class="card"><div class="empty">Loading…</div></div></div>
  <button id="refresh">Refresh</button>
  <footer>
    Updates automatically at 3pm Hong Kong time, weekdays.<br>
    This page is read-only — it shows status, it doesn't change anything.
  </footer>
</div>
<script>
const app = document.getElementById("app");

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function card(cls, icon, head, note) {
  return `<div class="card banner ${cls}"><div class="icon">${icon}</div>
    <div class="head">${esc(head)}</div><div class="note">${esc(note)}</div></div>`;
}

function list(items, tag, cls) {
  if (!items || !items.length) return `<div class="empty">None.</div>`;
  return "<ul>" + items.map(x => {
    // FEHD often repeats the English name in the Chinese field; don't echo it.
    const zh = x.tc && x.tc !== x.en ? `<div class="zh">${esc(x.tc)}</div>` : "";
    const where = x.district ? ` <span class="zh">· ${esc(x.district)}</span>` : "";
    return `<li><span class="tag ${cls}">${tag}</span><span class="name">${esc(x.en)}</span>${where}${zh}</li>`;
  }).join("") + "</ul>";
}

function render(d) {
  const total = d.total == null ? "—" : d.total;
  let out = "";

  if (d.state === "error") {
    out += card("warn", "⚠️", "Check failed", d.message || "The last check could not finish.");
  } else if (d.state === "updated") {
    const c = d.last_change || { added: [], removed: [] };
    out += card("ok", "🔄", "Updated",
      `${c.added.length} added, ${c.removed.length} removed on ${c.date || ""}.`);
  } else {
    out += card("ok", "✅", "Up to date", "No changes from FEHD.");
  }

  out += `<div class="facts">
    <div class="fact"><div class="k">FEHD list dated</div><div class="v">${esc(d.fehd_date || "—")}</div></div>
    <div class="fact"><div class="k">Restaurants</div><div class="v">${esc(total)}</div></div>
    <div class="fact"><div class="k">Last checked</div><div class="v">${esc(d.last_checked_hkt || "—")}</div></div>
    <div class="fact"><div class="k">Time zone</div><div class="v">Hong Kong</div></div>
  </div>`;

  const c = d.last_change;
  if (c) {
    out += `<div class="card"><h2>Newly added — ${c.added.length}</h2>${list(c.added, "NEW", "t-new")}</div>`;
    out += `<div class="card"><h2>Removed by FEHD — ${c.removed.length}</h2>
      ${list(c.removed, "GONE", "t-gone")}
      <div class="empty" style="margin-top:10px">Kept on the ‘Delisted’ tab, seating value intact.</div></div>`;
    out += `<div class="card"><h2>Last changed</h2><div>${esc(c.date || "—")} · FEHD dated ${esc(c.fehd_date || "—")}</div></div>`;
  }

  if (d.history && d.history.length > 1) {
    out += `<div class="card"><h2>Recent checks that changed something</h2><ul class="hist">` +
      d.history.slice(0, 8).map(h =>
        `<li><span>${esc(h.checked || "")}</span><span>+${h.added} / −${h.removed}</span></li>`
      ).join("") + `</ul></div>`;
  }

  app.innerHTML = out;
}

function load() {
  app.innerHTML = `<div class="card"><div class="empty">Checking…</div></div>`;
  // Cache-bust: iOS Safari caches aggressively when saved to the Home Screen.
  fetch("./status.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(e => {
      app.innerHTML = card("warn", "📡", "Can't load status",
        "No connection, or the status file hasn't been published yet. (" + e.message + ")");
    });
}

document.getElementById("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
